; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp

[common]
; -fno-exceptions / -fno-rtti are deliberately absent: the Arduino ESP32 core
; already builds with both, and putting them here applies them to C files too,
; which just emits a warning per file.
build_flags =
    -std=gnu++17
    -I src

[env:esp]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_size = 16MB
; The board manifest declares upload.flash_size = 8MB, which is what esptool
; stamps into the bootloader header. board_build.flash_size alone does NOT
; change it, so the bootloader believed the chip was 8MB and PlatformIO
; defaulted to default_8MB.csv - leaving half the flash unaddressable.
;
; This is also why default_16MB.csv boot-looped earlier: it places spiffs at
; 0xc90000 and coredump at 0xff0000, both past the 8MB the bootloader thought
; existed, so the partition table failed validation on every boot.
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.arduino.memory_type = qio_opi
extra_scripts = pre:tools/embed_ui.py
; Requires board_upload.flash_size = 16MB above. Without that the bootloader
; header says 8MB, this table's spiffs/coredump land past the end of what the
; bootloader can see, and the board boot-loops (observed 2026-09-06).
; Gives a 6.55MB app partition, up from 3.19MB on the 8MB default.
board_build.partitions = default_16MB.csv
; The Arduino core appends its own -std=gnu++11 after our flags, so it wins
; unless removed first. Without this, Settings.h's `inline constexpr` compiles
; as a C++11 extension and only warns.
build_unflags = -std=gnu++11
build_flags =
    ${common.build_flags}
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DUSER_SETUP_LOADED
    -DILI9341_DRIVER
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MOSI=11
    -DTFT_SCLK=12
    -DTFT_CS=10
    -DTFT_DC=8
    -DTFT_RST=9
    -DTFT_BL=21
    -DSPI_FREQUENCY=40000000
    ; TFT_eSPI defaults SPI_PORT to FSPI on the S3, which builds a SPIClass on a
    ; bus whose begin() fails -- TFT_eSPI::init() then crashes in
    ; begin_tft_write() writing through a null bus pointer. USE_FSPI_PORT selects
    ; SPI_PORT 2, i.e. SPI3_HOST, which is the fix from Bodmer/TFT_eSPI#3743 and
    ; what the working reference project patches into the library by hand.
    ; NOTE: -DTFT_SPI_PORT only fills a reporting field; it does not pick the bus.
    -DUSE_FSPI_PORT
    -DTFT_SPI_PORT=3
    -DTFT_SPI_OVERLAP
    -DLOAD_GLCD
    -DLOAD_FONT2
    -DLOAD_FONT4
    -DSMOOTH_FONT
    ; BLE throughput: without these the 30 kB/s budget does not close.
    ; Extended advertising off (we advertise legacy), roles trimmed to peripheral.
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
    -DCONFIG_BT_NIMBLE_ATT_PREFERRED_MTU=517
    -DCONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED
    -DCONFIG_BT_NIMBLE_ROLE_OBSERVER_DISABLED
lib_deps =
    bblanchon/ArduinoJson@^7.4.3
    bodmer/TFT_eSPI@^2.5.43
    esp32async/AsyncTCP@^3.5.0
    esp32async/ESPAsyncWebServer@^3.12.0
    h2zero/NimBLE-Arduino@^1.4.3
monitor_filters = esp32_exception_decoder
; On-device tests: compile src/ into the test binary (main.cpp is guarded with
; #ifndef PIO_UNIT_TESTING so its setup/loop do not collide with the test's).
test_build_src = yes
test_filter = embedded/*
build_type = debug

[env:native]
platform = native
build_flags =
    ${common.build_flags}
    -DUNIT_TEST
lib_deps =
    bblanchon/ArduinoJson@^7.4.3
test_build_src = yes
test_filter = native/*
build_src_filter =
    -<*>
    +<core/Format.cpp>
    +<config/Settings.cpp>
    +<config/internal/MemoryStore.cpp>
    +<config/internal/ConfigApi.cpp>
    +<config/internal/ConfigService.cpp>
    +<core/LogRing.cpp>
    +<radio/RadioMode.cpp>
    +<radio/HoldDetector.cpp>
    +<ble/TelemetryRing.cpp>
    +<ble/RaceChronoGps.cpp>
