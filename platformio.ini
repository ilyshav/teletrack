; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp

[common]
build_flags =
    -std=gnu++17
    -fno-exceptions
    -fno-rtti
    -I src

[env:esp]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
build_flags =
    ${common.build_flags}
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DUSER_SETUP_LOADED
    -DILI9341_DRIVER
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MOSI=11
    -DTFT_SCLK=12
    -DTFT_CS=10
    -DTFT_DC=8
    -DTFT_RST=9
    -DTFT_BL=21
    -DSPI_FREQUENCY=40000000
    -DTFT_SPI_PORT=3
    -DTFT_SPI_OVERLAP
    -DLOAD_GLCD
    -DLOAD_FONT2
    -DLOAD_FONT4
    -DSMOOTH_FONT
lib_deps =
    bblanchon/ArduinoJson@^7.4.3
    bodmer/TFT_eSPI@^2.5.43
    esp32async/AsyncTCP@^3.5.0
    esp32async/ESPAsyncWebServer@^3.12.0
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
test_filter = embedded/*
build_type = debug

[env:native]
platform = native
build_flags =
    ${common.build_flags}
    -DUNIT_TEST
lib_deps =
    bblanchon/ArduinoJson@^7.4.3
test_build_src = yes
test_filter = native/*
build_src_filter =
    -<*>
    +<core/Format.cpp>
    +<config/Settings.cpp>
    +<config/internal/MemoryStore.cpp>
