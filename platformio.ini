; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp

[common]
; -fno-exceptions / -fno-rtti are deliberately absent: the Arduino ESP32 core
; already builds with both, and putting them here applies them to C files too,
; which just emits a warning per file.
build_flags =
    -std=gnu++17
    -I src

[env:esp]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
; board_build.partitions = default_16MB.csv
; The Arduino core appends its own -std=gnu++11 after our flags, so it wins
; unless removed first. Without this, Settings.h's `inline constexpr` compiles
; as a C++11 extension and only warns.
build_unflags = -std=gnu++11
build_flags =
    ${common.build_flags}
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DUSER_SETUP_LOADED
    -DILI9341_DRIVER
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MOSI=11
    -DTFT_SCLK=12
    -DTFT_CS=10
    -DTFT_DC=8
    -DTFT_RST=9
    -DTFT_BL=21
    -DSPI_FREQUENCY=40000000
    -DTFT_SPI_PORT=3
    -DTFT_SPI_OVERLAP
    -DLOAD_GLCD
    -DLOAD_FONT2
    -DLOAD_FONT4
    -DSMOOTH_FONT
lib_deps =
    bblanchon/ArduinoJson@^7.4.3
    bodmer/TFT_eSPI@^2.5.43
    esp32async/AsyncTCP@^3.5.0
    esp32async/ESPAsyncWebServer@^3.12.0
monitor_filters = esp32_exception_decoder
; On-device tests: compile src/ into the test binary (main.cpp is guarded with
; #ifndef PIO_UNIT_TESTING so its setup/loop do not collide with the test's).
test_build_src = yes
test_filter = embedded/*
build_type = debug

[env:native]
platform = native
build_flags =
    ${common.build_flags}
    -DUNIT_TEST
lib_deps =
    bblanchon/ArduinoJson@^7.4.3
test_build_src = yes
test_filter = native/*
build_src_filter =
    -<*>
    +<core/Format.cpp>
    +<config/Settings.cpp>
    +<config/internal/MemoryStore.cpp>
    +<config/internal/ConfigApi.cpp>
    +<core/LogRing.cpp>
